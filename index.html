 {name:'Day 1 · Gym',place:'gym',ex:[['squat',3,10],['hip_thrust',3,10],['row',3,10],['chestpress',2,10],['deadbug',2,8],['walk',1,12]]},
 {name:'Day 2 · Gym',place:'gym',ex:[['rdl',3,10],['stepup',2,8],['pulldown',3,10],['shoulder',2,10],['pallof',2,10],['bike',1,12]]},
 {name:'Day 3 · Home',place:'home',ex:[['bridge',3,12],['squat',3,10],['dbrow',3,10],['dbpress',3,10],['bird',2,8],['walk',1,15]]}]},
{id:'quick',name:'Busy-Day Express',tag:'20–25 minutes',desc:'Shorter sessions for packed days. Two strength circuits and an optional walk.',days:[
 {name:'Quick Gym',place:'gym',ex:[['squat',2,10],['row',2,10],['hip_thrust',2,10],['deadbug',2,8]]},
 {name:'Quick Home',place:'home',ex:[['bridge',2,12],['dbrow',2,10],['dbpress',2,10],['bird',2,8]]}]},
{id:'gentle',name:'Core & Glute Reset',tag:'Low-impact',desc:'Controlled movements, gentle strength and confidence-building. Reduce range or skip movements as needed.',days:[
 {name:'Core & Glutes',place:'either',ex:[['bridge',3,10],['bird',2,8],['chair_squat',2,8],['deadbug',2,8],['walk',1,15]]},
 {name:'Upper & Core',place:'either',ex:[['dbrow',2,10],['dbpress',2,10],['pallof',2,10],['curl',2,12],['walk',1,15]]}]},
{id:'cardio',name:'Low-Impact Cardio',tag:'Optional conditioning',desc:'Flexible walking and cycling sessions to complement strength training.',days:[
 {name:'Walk & Move',place:'either',ex:[['walk',1,25]]},
 {name:'Bike & Walk',place:'gym',ex:[['bike',1,20],['incline',1,10]]}]}
];
let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!state||typeof state!=='object')state={};state.enabled=Array.isArray(state.enabled)?state.enabled:['foundation','quick'];state.sessions=Array.isArray(state.sessions)?state.sessions:[];state.draft=state.draft||null;state.settings=state.settings||{units:'lb'};
let page='home',selectedProgram='foundation',selectedDay=0,showGuide={};
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
const date=()=>new Date().toLocaleDateString('en-CA');
const sessions=()=>[...state.sessions].sort((a,b)=>b.date.localeCompare(a.date));
const totalSets=s=>s.exercises.reduce((t,e)=>t+e.sets.filter(x=>x.done).length,0);
function visual(kind){
 const isFloor=kind==='floor',isBridge=kind==='bridge',isBike=kind==='bike';
 const pose={
 squat:{body:'100,44 100,80 81,107 72,135',other:'100,80 125,107 145,134',arms:'100,57 83,76 97,85 100,57 117,76 103,85',motion:'squat'},
 bridge:{body:'48,111 82,102 117,102 148,111',other:'48,111 33,131 148,111 164,131',arms:'82,102 76,122 117,102 120,122',motion:'bridge'},
 hinge:{body:'100,44 100,85 84,115 80,137',other:'100,85 118,116 119,137',arms:'100,58 79,87 76,109 100,58 120,87 123,109',motion:'hinge'},
 step:{body:'100,44 100,82 82,105 76,135',other:'100,82 125,105 142,105',arms:'100,58 82,83 100,58 118,83',motion:'step'},
 pull:{body:'100,44 100,94 82,134',other:'100,94 118,134',arms:'100,58 75,78 56,65 100,58 125,78 144,65',motion:'pull'},
 push:{body:'100,44 100,94 82,134',other:'100,94 118,134',arms:'100,58 75,78 57,76 100,58 125,78 143,76',motion:'push'},
 raise:{body:'100,44 100,94 82,134',other:'100,94 118,134',arms:'100,58 75,78 62,98 100,58 125,78 138,98',motion:'raise'},
 curl:{body:'100,44 100,94 82,134',other:'100,94 118,134',arms:'100,58 80,83 78,107 100,58 120,83 122,107',motion:'curl'},
 floor:{body:'58,102 93,102 125,114',other:'93,102 119,72 125,114 157,127',arms:'58,102 42,77',motion:'floor'},
 walk:{body:'100,44 100,93 80,130',other:'100,93 126,129',arms:'100,58 80,82 100,58 120,82',motion:'walk'},
 bike:{body:'100,44 100,91 78,115',other:'100,91 127,115',arms:'100,58 78,82 100,58 125,80',motion:'bike'}
 }[kind]||{body:'100,44 100,94 80,132',other:'100,94 120,132',arms:'100,58 75,82 100,58 125,82',motion:'walk'};
 const poly=(pts)=>`<polyline points="${pts}" fill="none" stroke="#b7e4cf" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>`;
 const head=isFloor||isBridge?'':`<circle cx="100" cy="31" r="11" fill="none" stroke="#f3f4ef" stroke-width="4"/>`;
 return `<div class="motion-demo" data-motion="${pose.motion}" aria-label="Looping simplified movement demonstration: ${kind}">
 <svg viewBox="0 0 200 165" role="img" aria-label="Animated position guide showing start and end phases of the movement. Read the form instructions below.">
 <line x1="13" y1="145" x2="188" y2="145" stroke="#58716b" stroke-width="2"/>
 ${isBike?'<circle cx="87" cy="132" r="18" fill="none" stroke="#58716b" stroke-width="3"/><circle cx="142" cy="132" r="18" fill="none" stroke="#58716b" stroke-width="3"/><path d="M87 132 L111 108 L142 132 L87 132 M111 108 L103 98" stroke="#58716b" stroke-width="3" fill="none"/>':''}
 ${kind==='step'?'<rect x="120" y="117" width="57" height="28" rx="3" fill="#354f4c"/>':''}
 <g class="demo-person">${head}${poly(pose.body)}${poly(pose.other)}<g class="demo-arms">${poly(pose.arms)}</g></g>
 <text x="100" y="159" font-size="10" text-anchor="middle" fill="#b5c6c7">SLOW, CONTROLLED MOTION · LOOP</text>
 </svg></div>`;
}
function toggleAnimation(btn){const box=btn.closest('.exercise-visual');const paused=box.classList.toggle('demo-paused');btn.textContent=paused?'Play animation':'Pause animation'}
function guide(id){let e=E[id];return `<div class="exercise-visual">${visual(e.kind)}<div class="demo-controls"><button type="button" class="btn" onclick="toggleAnimation(this)">Pause animation</button><span class="muted small">Illustrative movement, not a technique video</span></div><ol class="form-cues">${e.cues.map(x=>`<li>${esc(x)}</li>`).join('')}</ol><p class="muted small">Move in a comfortable range. Stop if you feel pain, pelvic heaviness, leaking, or abdominal doming; consider a pelvic-floor physical therapist if these persist.</p></div>`}
function hero(){return `<div class="card hero"><div class="hero-art" aria-hidden="true"><span class="orbit orbit-one"></span><span class="orbit orbit-two"></span><span class="hero-flower">✳</span><span class="hero-star">✦</span></div><div class="hero-copy"><div class="eyebrow">Your space to feel good</div><h1>Find your<br><em>kind of strong.</em></h1><p>Some days you lift. Some days you just show up. Both count.</p><button class="btn primary" onclick="go('programs')">Find your movement <span aria-hidden="true">↗</span></button></div><div class="hero-footer">MOVE WITH INTENTION <span>✳</span> GROW AT YOUR PACE</div></div>`}
function home(){let a=sessions(),week=dateOffset(-6),recent=a.filter(x=>x.date>=week);return `${hero()}<div class="grid3"><div class="stat"><strong>${recent.length}</strong><span>Sessions · last 7 days</span></div><div class="stat"><strong>${a.length}</strong><span>Workouts logged</span></div><div class="stat"><strong>${a.reduce((t,s)=>t+totalSets(s),0)}</strong><span>Sets completed</span></div></div><div class="card"><h2>Made for your rhythm <span class="heading-spark">✳</span></h2>${programs.filter(p=>state.enabled.includes(p.id)).map(p=>`<div class="row" style="padding:10px 0;border-bottom:1px solid var(--line)"><div><strong>${esc(p.name)}</strong><div class="muted small">${esc(p.tag)}</div></div><button class="btn" onclick="choose('${p.id}')">Open</button></div>`).join('')||'<p class="muted">Enable a program to begin.</p>'}</div><div class="card"><h2>Little wins. Big energy.</h2><p class="muted">More consistent sessions, steadier form, stronger lifts, and improved energy. Weight loss also depends on nutrition and your overall routine; no workout can spot-reduce fat.</p></div>`}
function dateOffset(d){let x=new Date();x.setDate(x.getDate()+d);return x.toLocaleDateString('en-CA')}
function programsPage(){return `<div class="eyebrow">Flexible by design</div><h1>Find your <em>flow.</em></h1><p class="muted">Toggle the programs you want available. You can switch programs at any time.</p>${programs.map(p=>`<div class="card"><div class="row"><div><span class="badge">${esc(p.tag)}</span><h2>${esc(p.name)}</h2></div><label class="toggle"><input type="checkbox" ${state.enabled.includes(p.id)?'checked':''} onchange="toggleProgram('${p.id}',this.checked)"><span>Enabled</span></label></div><p class="muted">${esc(p.desc)}</p><div class="pill-list">${p.days.map(d=>`<span class="chip">${esc(d.name)}</span>`).join('')}</div><div style="margin-top:15px"><button class="btn primary" onclick="choose('${p.id}')">View workouts</button></div></div>`).join('')}`}
function choose(id){selectedProgram=id;selectedDay=0;go('program-detail')}
function programDetail(){let p=programs.find(x=>x.id===selectedProgram)||programs[0],d=p.days[selectedDay];return `<button class="btn" onclick="go('programs')">← All programs</button><div class="eyebrow" style="margin-top:20px">${esc(p.tag)}</div><h1>${esc(p.name)}</h1><p class="muted">${esc(p.desc)}</p><div class="actions">${p.days.map((x,i)=>`<button class="btn ${i===selectedDay?'primary':''}" onclick="selectedDay=${i};render()">${esc(x.name)}</button>`).join('')}</div><div class="card"><div class="row"><div><h2>${esc(d.name)}</h2><span class="chip">${esc(d.place==='either'?'Gym or home':d.place)}</span></div><button class="btn primary" onclick="start('${p.id}',${selectedDay})">Start workout</button></div><div class="line"></div>${d.ex.map(([id,sets,reps])=>`<div class="exercise"><div class="exercise-top"><div><h3>${esc(E[id].name)}</h3><div class="muted small">${sets} × ${reps} ${E[id].unit||'reps'} · ${esc(E[id].group)}</div></div><button class="btn" onclick="toggleGuide('${id}')">Form guide</button></div>${showGuide[id]?guide(id):''}</div>`).join('')}</div>`}
function toggleGuide(id){showGuide[id]=!showGuide[id];render()}
function start(id,day){if(state.draft&&!confirm('Replace your unfinished workout?'))return;let p=programs.find(p=>p.id===id),d=p.days[day];state.draft={id:'w'+Date.now(),program:id,name:d.name,date:date(),notes:'',exercises:d.ex.map(([id,count,reps])=>({id,sets:Array.from({length:count},()=>({weight:'',reps:E[id].unit?String(reps):'',done:false}))}))};save();go('log')}
function log(){let s=state.draft;if(!s)return `<div class="empty"><h1>No workout in progress</h1><p>Choose a workout from the library to get started.</p><button class="btn primary" onclick="go('programs')">Browse workouts</button></div>`;return `<div class="eyebrow">Today's session</div><h1>${esc(s.name)}</h1><div class="card"><label>Workout date<input type="date" value="${esc(s.date)}" onchange="updateDraft('date',this.value)"></label><label>Notes<textarea oninput="updateDraft('notes',this.value)">${esc(s.notes)}</textarea></label></div><p class="muted small">Check off each set when complete. Weights are optional for bodyweight movements; cardio uses minutes.</p>${s.exercises.map((ex,i)=>{let e=E[ex.id];return `<div class="card"><div class="exercise-top"><div><h2>${esc(e.name)}</h2><p class="muted small">${esc(e.group)}</p></div><button class="btn" onclick="toggleGuide('${ex.id}')">${showGuide[ex.id]?'Hide guide':'Form guide'}</button></div>${showGuide[ex.id]?guide(ex.id):''}<div class="sets">${ex.sets.map((set,j)=>`<div class="set"><strong>Set ${j+1}</strong>${!e.unit?`<label>Weight</label><input aria-label="Set ${j+1} weight" type="number" inputmode="decimal" min="0" step="0.5" placeholder="lb" value="${esc(set.weight)}" onchange="setField(${i},${j},'weight',this.value)">`:''}<label>${e.unit?'Minutes':'Reps'}</label><input aria-label="Set ${j+1} ${e.unit?'minutes':'reps'}" type="number" min="0" value="${esc(set.reps)}" onchange="setField(${i},${j},'reps',this.value)"><label class="toggle"><input aria-label="Set ${j+1} completed" type="checkbox" ${set.done?'checked':''} onchange="setField(${i},${j},'done',this.checked)">Done</label></div>`).join('')}</div><div class="actions" style="margin-top:12px"><button class="btn" onclick="addSet(${i})">+ Set</button><button class="btn" onclick="removeSet(${i})" ${ex.sets.length<2?'disabled':''}>− Set</button><button class="btn" onclick="swapExercise(${i})">Swap exercise</button></div></div>`}).join('')}<div class="card"><div class="row"><button class="btn primary" onclick="finish()">Save completed workout</button><button class="btn danger" onclick="discard()">Discard draft</button></div></div>`}
function updateDraft(k,v){state.draft[k]=v;save()}
function setField(i,j,k,v){state.draft.exercises[i].sets[j][k]=v;save()}
function addSet(i){state.draft.exercises[i].sets.push({weight:'',reps:'',done:false});save();render()}
function removeSet(i){state.draft.exercises[i].sets.pop();save();render()}
function swapExercise(i){let ex=state.draft.exercises[i],ids=Object.keys(E),idx=ids.indexOf(ex.id),choice=prompt('Enter an exercise name or ID:\n'+ids.map(id=>id+' — '+E[id].name).join('\n'),E[ex.id].name);if(!choice)return;let id=ids.find(x=>x===choice.toLowerCase().trim()||E[x].name.toLowerCase()===choice.toLowerCase().trim());if(!id)return alert('Exercise not found. Choose a listed name or ID.');ex.id=id;save();render()}
function finish(){let s=state.draft;if(!s)return;if(!s.exercises.some(e=>e.sets.some(x=>x.done)))return alert('Check at least one completed set.');state.sessions.push(structuredClone(s));state.draft=null;save();go('history')}
function discard(){if(confirm('Discard this unfinished workout?')){state.draft=null;save();go('home')}}
function history(){let a=sessions(),month=date().slice(0,7),thisMonth=a.filter(s=>s.date.startsWith(month));let total=a.reduce((t,s)=>t+totalSets(s),0);return `<div class="eyebrow">Progress over perfection</div><h1>Look at you <em>grow.</em></h1><div class="grid3"><div class="stat"><strong>${a.length}</strong><span>Workouts</span></div><div class="stat"><strong>${thisMonth.length}</strong><span>This month</span></div><div class="stat"><strong>${total}</strong><span>Completed sets</span></div></div><div class="card"><h2>Workout history</h2>${a.map(s=>`<div class="exercise"><div class="row"><div><strong>${esc(s.name)}</strong><div class="muted small">${esc(s.date)} · ${totalSets(s)} completed sets</div></div><div class="actions"><button class="btn" onclick="openSession('${s.id}')">Details</button><button class="btn danger" onclick="deleteSession('${s.id}')">Delete</button></div></div></div>`).join('')||'<div class="empty">Your completed workouts will appear here.</div>'}</div>`}
function openSession(id){let s=state.sessions.find(x=>x.id===id);if(!s)return;document.getElementById('app').innerHTML=`<button class="btn" onclick="go('history')">← Progress</button><h1>${esc(s.name)}</h1><p class="muted">${esc(s.date)}</p>${s.exercises.map(e=>`<div class="card"><h2>${esc(E[e.id]?.name||e.id)}</h2>${e.sets.map((x,i)=>`<p class="small">Set ${i+1}: ${esc(x.weight)||'Bodyweight'} ${x.weight?'lb · ':''}${esc(x.reps)||'—'} ${E[e.id]?.unit||'reps'} ${x.done?'✓':''}</p>`).join('')}</div>`).join('')}<div class="card"><p>${esc(s.notes)}</p></div>`}
function deleteSession(id){if(!confirm('Delete this saved workout permanently?'))return;state.sessions=state.sessions.filter(s=>s.id!==id);save();render()}
function settings(){return `<h1>The little <em>details.</em></h1><div class="card"><h2>Your data stays on this device</h2><p class="muted">This first version stores workout history locally in your browser. It is completely separate from FJORGE and does not use his Supabase account. Export backups regularly, especially before changing phones or clearing browser data.</p><div class="actions"><button class="btn primary" onclick="exportData()">Export backup JSON</button><label class="btn" style="margin:0">Import backup JSON<input type="file" accept="application/json,.json" style="display:none" onchange="importData(this.files[0])"></label></div></div><div class="card"><h2>Movement guidance</h2><p class="muted">The illustrations are simplified position reminders, not detailed anatomical instruction or a substitute for qualified coaching. Start with comfortable loads and controlled movement. If postpartum symptoms such as pelvic pressure, leaking or abdominal doming occur, scale back and consider pelvic-floor physical therapy.</p></div>`}
function exportData(){let blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='form-flow-backup-'+date()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function importData(file){if(!file)return;try{let data=JSON.parse(await file.text());if(!data.state||!Array.isArray(data.state.sessions))throw Error('Invalid backup');if(!confirm('Replace all current Form & Flow data with this backup?'))return;state=data.state;save();go('home')}catch(e){alert('Could not import backup: '+e.message)}}
function toggleProgram(id,on){state.enabled=on?[...new Set([...state.enabled,id])]:state.enabled.filter(x=>x!==id);save();render()}
function go(p){page=p;render();window.scrollTo(0,0)}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page||(page==='program-detail'&&b.dataset.page==='programs')));document.getElementById('app').innerHTML=({home,programs:programsPage,'program-detail':programDetail,log,history,settings}[page]||home)()}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script><script src="flow-tools.js"></script></body></html>
